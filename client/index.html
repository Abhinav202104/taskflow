<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TaskFlow – Premium Interactive Task Manager" />
    <title>TaskFlow</title>
    
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Instrument+Sans:wght@400;500;600&display=swap');

      :root {
        --bg:            #0a0a0f;
        --surface:       rgba(22,22,26,0.92);
        --surface2:      #23232a;
        --border:        rgba(255,255,255,0.09);
        --border-bright: rgba(255,255,255,0.14);
        --accent:        #7c6dfa;
        --accent2:       #a855f7;
        --accent-glow:   rgba(124,109,250,0.35);
        --radius:        18px;
        --shadow-glow:   0 0 40px rgba(124,109,250,0.3);
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }
      
      body {
        font-family: 'Instrument Sans', system-ui, sans-serif;
        background: var(--bg);
        color: #f0effe;
        min-height: 100vh;
        overflow-x: hidden;
        position: relative;
      }

      #root { position: relative; z-index: 10; }

      /* Advanced Backdrop Filter Glassmorphism */
      .floating-box, .task-item, .progress-wrap, .add-task-btn, .add-section {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        backdrop-filter: blur(24px) saturate(180%) brightness(1.08);
        box-shadow: 0 12px 50px rgba(0,0,0,0.55);
        transition: all 0.4s cubic-bezier(0.34,1.56,0.64,1);
      }

      .floating-box:hover, .task-item:hover, .progress-wrap:hover, .add-task-btn:hover, .add-section:hover {
        backdrop-filter: blur(32px) saturate(220%) contrast(115%);
        transform: translateY(-8px) scale(1.02);
        box-shadow: var(--shadow-glow);
        border-color: rgba(124,109,250,0.45);
      }

      /* Floating Panels */
      .floating-box {
        position: fixed;
        padding: 18px 22px;
        z-index: 5;
        pointer-events: auto;
      }

      .float-title {
        font-family: 'Syne', sans-serif;
        font-weight: 800;
        font-size: 0.98rem;
        margin-bottom: 10px;
        color: #a89ff5;
      }

      /* Specific Floating Boxes */
      #float-stats { top: 100px; right: 50px; width: 200px; }
      #float-streak { top: 280px; right: 45px; width: 170px; text-align: center; }
      #float-quote { bottom: 140px; left: 50px; width: 260px; }

      .streak-number {
        font-size: 2.8rem;
        font-weight: 800;
        background: linear-gradient(135deg, #fb923c, #f87171);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      /* Floating Action Button */
      #fab {
        position: fixed;
        bottom: 40px;
        right: 40px;
        width: 68px;
        height: 68px;
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
        color: white;
        box-shadow: 0 15px 40px rgba(124,109,250,0.5);
        cursor: pointer;
        z-index: 20;
        transition: all 0.35s cubic-bezier(0.34,1.56,0.64,1);
      }

      #fab:hover {
        transform: scale(1.18) rotate(15deg);
        box-shadow: 0 20px 50px rgba(124,109,250,0.6);
      }

      /* Task List 3D Ready */
      .task-list {
        perspective: 1300px;
        perspective-origin: 50% 40%;
      }

      .task-item {
        transform-style: preserve-3d;
      }

      .task-item:hover .task-title {
        transform: translateZ(20px);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- Floating Interactive Panels -->
    <div class="floating-box" id="float-stats">
      <div class="float-title">Focus Score</div>
      <div style="font-size: 2.4rem; font-weight: 800; line-height: 1;">94</div>
      <div style="font-size: 0.8rem; color: #4ade80;">↑12% this week</div>
    </div>

    <div class="floating-box" id="float-streak">
      <div class="float-title">🔥 Current Streak</div>
      <div class="streak-number">9</div>
      <div style="font-size: 0.78rem; color: #8885a0;">Personal Best: 21 days</div>
    </div>

    <div class="floating-box" id="float-quote">
      <div class="float-title">Daily Inspiration</div>
      <div style="font-style: italic; line-height: 1.5;">
        “Consistency is the bridge between goals and achievement.”
      </div>
      <div style="margin-top: 12px; font-size: 0.73rem; opacity: 0.7;">— TaskFlow</div>
    </div>

    <!-- Floating Action Button -->
    <div id="fab" title="Quick Add Task">✚</div>

    <script type="module" src="/src/main.jsx"></script>

    <script>
      // Gentle floating animation for panels
      function animateFloatingElements() {
        const boxes = document.querySelectorAll('.floating-box');
        boxes.forEach((box, i) => {
          setInterval(() => {
            const y = Math.sin(Date.now() / 1400 + i * 1.2) * 7;
            box.style.transform = `translateY(${y}px)`;
          }, 50);
        });
      }

      // FAB Interaction
      document.getElementById('fab').addEventListener('click', () => {
        const fab = document.getElementById('fab');
        fab.style.transform = 'scale(0.85) rotate(45deg)';
        
        setTimeout(() => {
          alert("Quick Add Task opened! ✨\n(Connect this to your React add modal)");
          fab.style.transform = '';
        }, 200);
      });

      // Initialize floating animation
      window.addEventListener('load', animateFloatingElements);
    </script>
  </body>
</html>
